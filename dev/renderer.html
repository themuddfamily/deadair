<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>DEAD AIR — renderer harness</title>
<link rel="stylesheet" href="../css/base.css">
<style>
  body.atlas { overflow: auto; height: auto; background: #1a1c1a; }
  body.atlas #game { display: none; }
  #atlas { display: flex; flex-wrap: wrap; gap: 10px; padding: 10px; font: 11px monospace; color: #cfd2c8; }
  #atlas .cell { background: #0c0d0c; padding: 6px; border: 1px solid #2a2d2a; }
  #atlas .imgs { display: flex; gap: 4px; align-items: flex-end;
    background-image: linear-gradient(45deg, #242624 25%, transparent 25%, transparent 75%, #242624 75%), linear-gradient(45deg, #242624 25%, transparent 25%, transparent 75%, #242624 75%);
    background-size: 8px 8px; background-position: 0 0, 4px 4px; }
  #atlas canvas { image-rendering: pixelated; display: block; }
  #atlas canvas.ab { outline: 1px dashed #5a4a2a; }
  #atlas .lab { margin-top: 4px; }
  #atlas .info { width: 100%; color: #ffb347; }
  #dev-hud { position: fixed; left: 8px; top: 8px; z-index: 50; font: 12px monospace; color: #9f9; background: rgba(0,0,0,.55); padding: 4px 6px; white-space: pre; pointer-events: none; }
  #dev-cctv { position: fixed; right: 8px; bottom: 8px; z-index: 50; border: 2px solid #333; image-rendering: pixelated; width: 320px; height: 240px; display: none; }
</style>
</head>
<body>
  <div id="game">
    <div id="stage">
      <canvas id="view" width="480" height="270"></canvas>
      <div id="hud"></div>
      <div id="screens"></div>
    </div>
  </div>
  <div id="dev-hud"></div>
  <canvas id="dev-cctv" width="160" height="120"></canvas>
  <script src="../js/core.js"></script>
  <script src="../js/textures.js"></script>
  <script src="../js/raycaster.js"></script>
  <script src="renderer-atlas.js"></script>
  <script src="renderer-map.js"></script>
  <script src="renderer-harness.js"></script>
</body>
</html>
